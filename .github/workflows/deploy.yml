name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # PENTING: Ganti 'ubuntu-latest' dengan 'self-hosted'
    # Ini memerintahkan GitHub untuk mengirim job ini ke server Ubuntu Anda
    runs-on: self-hosted

    steps:
      # 1. Checkout kode sumber (wajib agar file ada di server)
      - name: Checkout Code
        uses:
          actions/checkout@v4

          # 2. Jalankan perintah deployment langsung di server
      - name: Deploy Application
        run: |
          echo "Memulai deployment di server lokal..."
          cd ~/ezaa-me

          # 1. Ambil riwayat commit terbaru dari GitHub tanpa menggabungkannya dulu
          git fetch origin main

          # 2. Paksa branch lokal untuk sama persis dengan yang ada di GitHub (Menghapus divergent/konflik)
          git reset --hard origin/main

          # 3. Build ulang container Docker
          docker compose up -d --build
          echo "Deployment selesai!"
